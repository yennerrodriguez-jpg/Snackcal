<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2196f3">
<link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <title>Snack Loss Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Missing Snack Calculator</h2>

    <input type="number" id="missing" placeholder="Snacks Missing">
    <input type="number" id="price" placeholder="Wholesale Price per Snack">

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    function calculate() {
      const missing = parseFloat(document.getElementById('missing').value) || 0;
      const price = parseFloat(document.getElementById('price').value) || 0;

      const totalValue = missing * price;
      const commission = totalValue * 0.20;
      const youGet = totalValue - commission;

      document.getElementById('output').innerHTML = `
        Missing Snacks: ${missing}<br>
        Total Value: $${totalValue.toFixed(2)}<br>
        Commission (Friend Keeps): $${commission.toFixed(2)}<br>
        You Get: $${youGet.toFixed(2)}
      `;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
